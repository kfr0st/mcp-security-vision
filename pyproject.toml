[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-vision"
version = "2.1.0"
description = "Servidor MCP de videovigilancia inteligente (YOLOv8 + reconocimiento facial + zonas de intrusión)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kfr0st", email = "kfr0st@users.noreply.github.com" }]
keywords = ["mcp", "model-context-protocol", "yolov8", "security", "cctv", "face-recognition", "opencv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mcp>=1.2,<3",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.1.0", "face-recognition>=1.3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "opencv-python-headless>=4.8.0"]
docker = ["ultralytics>=8.1.0", "face-recognition>=1.3.0"]

[project.scripts]
mcp-security-vision = "mcp_security_vision.server:main"

[project.urls]
Homepage = "https://github.com/kfr0st/mcp-security-vision"
Issues = "https://github.com/kfr0st/mcp-security-vision/issues"

[tool.setuptools]
packages = ["mcp_security_vision"]

[tool.setuptools.package-data]
mcp_security_vision = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: pruebas que levantan el servidor MCP en un subproceso",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["mcp_security_vision"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "venv", "data", "snapshots", "known_faces"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
    "E501",   # el formateador controla el ancho de línea
    "RUF001", # caracteres unicode en mensajes en español (acentos, emoji)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N806", "B011", "SLF001"]
