name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ruff
        run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests · Python ${{ matrix.python }} · ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
        # Probar el SDK MCP 1.x (FastMCP) y 2.x (MCPServer) gracias al shim de compatibilidad
        mcp: ["mcp>=1.9,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias ligeras (sin torch ni dlib)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "${{ matrix.mcp }}"
          pip install --no-deps -e .

      - name: Ejecutar tests
        env:
          VISION_FAKE_MODELS: "1"
          CAMERA_SOURCE: synthetic
        run: |
          python -m pytest --cov=mcp_security_vision --cov-report=term-missing \
            --cov-report=xml --junitxml=report.xml

      - name: Publicar cobertura (solo una combinación)
        if: matrix.python == '3.12' && matrix.mcp == 'mcp>=2,<3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            report.xml
          if-no-files-found: ignore

  smoke-docker:
    name: Smoke test del Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-security-vision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar el contenedor en modo demo
        run: |
          docker run -d --name vision-ci -p 8000:8000 \
            -e VISION_FAKE_MODELS=1 \
            -e CAMERA_SOURCE=synthetic \
            mcp-security-vision:ci
          for i in $(seq 1 60); do
            if python -c "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"; then
              echo "Servidor MCP escuchando en :8000"; exit 0
            fi
            sleep 2
          done
          echo "El servidor no abrió el puerto 8000"; docker logs vision-ci; exit 1
      - name: Logs del contenedor
        if: always()
        run: docker logs vision-ci || true
      - name: Detener contenedor
        if: always()
        run: docker rm -f vision-ci || true
